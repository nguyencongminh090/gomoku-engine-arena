<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu engine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html" data-i18n="app.name">Đấu engine</a>
  <button id="langBtn" type="button" class="ghost" data-i18n="lang.switch">English</button>
</header>
<main class="narrow">
  <h1 data-i18n="create.title">Tạo trận đấu engine</h1>
  <p class="muted" data-i18n="create.intro"></p>
  <form id="createForm" novalidate>
    <label for="rule"><span data-i18n="create.rule"></span>
      <select id="rule">
        <option value="freestyle" data-i18n="rule.freestyle"></option>
        <option value="standard" data-i18n="rule.standard"></option>
        <option value="caro" data-i18n="rule.caro"></option>
      </select>
    </label>
    <div class="row">
      <label for="w"><span data-i18n="create.width"></span>
        <input id="w" type="number" inputmode="numeric" min="5" max="22" value="15">
        <small class="err" data-error-for="w"></small></label>
      <label for="h"><span data-i18n="create.height"></span>
        <input id="h" type="number" inputmode="numeric" min="5" max="22" value="15">
        <small class="err" data-error-for="h"></small></label>
    </div>
    <p id="rapfiWarn" class="warn" hidden data-i18n="create.warnRapfi"></p>
    <div class="row">
      <label for="games"><span data-i18n="create.games"></span>
        <input id="games" type="number" inputmode="numeric" min="1" max="200" value="2">
        <small class="err" data-error-for="games"></small></label>
      <label for="reconnectSec"><span data-i18n="create.reconnect"></span>
        <input id="reconnectSec" type="number" inputmode="numeric" min="1" max="3600" value="60">
        <small class="err" data-error-for="reconnectSec"></small></label>
    </div>
    <div class="row">
      <label for="matchMinutes"><span data-i18n="create.matchMinutes"></span>
        <input id="matchMinutes" type="number" inputmode="decimal" min="0.1" step="any" value="5">
        <small class="err" data-error-for="matchMinutes"></small></label>
      <label for="turnSeconds"><span data-i18n="create.turnSeconds"></span>
        <input id="turnSeconds" type="number" inputmode="decimal" min="0" step="any" value="10">
        <small class="err" data-error-for="turnSeconds"></small></label>
    </div>
    <label for="openingsText"><span data-i18n="create.openings"></span>
      <textarea id="openingsText" rows="5" spellcheck="false">-</textarea>
      <small class="muted" data-i18n="create.openingsHelp"></small>
      <small class="err" data-error-for="openingsText"></small></label>
    <p id="formError" class="err" role="alert"></p>
    <button id="submitBtn" type="submit" class="primary" data-i18n="create.submit"></button>
  </form>
</main>
<script src="js/i18n.js"></script>
<script src="js/create.js"></script>
</body>
</html>
